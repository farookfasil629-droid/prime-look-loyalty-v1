<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIME LOOK | Loyalty & Rewards</title>
<style>
body{margin:0;min-height:100vh;background:#111;color:#d4af37;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
main{padding:30px}
h1{font-size:42px;letter-spacing:4px}
p{color:#eee;line-height:1.6}
</style>
</head>
<body>
<main>
<h1>PRIME LOOK</h1>
<p>DIGITAL LOYALTY & REWARDS</p>
<p>Welcome to PRIME LOOK</p>
<h2>Customer Registration</h2>
</section>
<form>
<label for="name">Full Name</label>
<input type="text" id="name" name="name" required>
<br><br>
<label for="email">Email Address</label>
<input type="email" id="email" name="email" required>
<br><br>
<label for="whatsapp">WhatsApp Number</label>
<input type="tel" id="whatsapp" name="whatsapp" required>
<br><br>
<label for="birthday">Birthday</label>
<input type="date" id="birthday" name="birthday" required>
<br><br>
<button type="submit">Register</button>
</form>
</main>
</body>
</html>
